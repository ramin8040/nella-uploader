<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd7ab" />
      <stop offset="50%" stop-color="#f5a45b" />
      <stop offset="100%" stop-color="#e08d3c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#ffd7ab" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="120" height="120" rx="32" fill="url(#brandGrad)" filter="url(#glow)" />
  <!-- Minimalist sound wave & melody notes mark -->
  <g fill="#ffffff" opacity="0.95">
    <rect x="30" y="52" width="6" height="16" rx="3" />
    <rect x="42" y="38" width="6" height="44" rx="3" />
    <rect x="54" y="26" width="6" height="68" rx="3" />
    <rect x="66" y="34" width="6" height="52" rx="3" />
    <rect x="78" y="44" width="6" height="32" rx="3" />
    <rect x="90" y="56" width="6" height="10" rx="3" />
  </g>
</svg>
